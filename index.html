<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V Carlos Saúde — CRM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Georgia,sans-serif}
:root{--green:#1E4D3B;--green-light:#2A6B52;--gold:#C9A84C;--gold-light:#E8C96A}
body{background:var(--green);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}

/* Padrão de fundo sutil */
body::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,0.04) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}

/* Brilho central suave */
body::after{content:'';position:absolute;top:-20%;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(201,168,76,0.08) 0%,transparent 70%);pointer-events:none}

.container{width:100%;max-width:400px;text-align:center;position:relative;z-index:1;margin:0 auto;display:flex;flex-direction:column;align-items:center}

/* LOGO */
.logo-wrap{margin-bottom:20px;display:flex;justify-content:center;align-items:center;width:100%}
.logo-ring{width:100px;height:100px;border-radius:50%;border:2px solid var(--gold);padding:4px;box-shadow:0 0 0 1px rgba(201,168,76,0.2),0 8px 32px rgba(0,0,0,0.25);overflow:hidden;display:flex;align-items:center;justify-content:center}
.logo-ring img{width:100%;height:100%;object-fit:contain;border-radius:50%}

/* TEXTOS */
.brand-name{font-size:22px;font-weight:300;color:#fff;letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px}
.brand-sub{font-size:12px;color:rgba(255,255,255,0.45);letter-spacing:.12em;text-transform:uppercase;margin-bottom:18px}

/* DIVISOR DOURADO */
.divider{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.1)}
.divider-diamond{width:6px;height:6px;background:var(--gold);transform:rotate(45deg);flex-shrink:0}

/* CARDS */
.cards{display:flex;flex-direction:column;gap:10px}
.entry-card{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:12px;cursor:pointer;text-decoration:none;transition:all .2s;border:1px solid transparent}

.entry-card.vendedor{background:var(--gold);border-color:var(--gold-light)}
.entry-card.vendedor:hover{background:var(--gold-light);transform:translateY(-2px);box-shadow:0 8px 24px rgba(201,168,76,0.3)}
.entry-card.vendedor .entry-title{color:#1a1a1a}
.entry-card.vendedor .entry-sub{color:rgba(0,0,0,0.55)}
.entry-card.vendedor .entry-icon{background:rgba(0,0,0,0.1)}
.entry-card.vendedor .entry-arrow{color:rgba(0,0,0,0.4)}

.entry-card.gestao{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.12)}
.entry-card.gestao:hover{background:rgba(255,255,255,0.14);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.2)}
.entry-card.gestao .entry-title{color:#fff}
.entry-card.gestao .entry-sub{color:rgba(255,255,255,0.5)}
.entry-card.gestao .entry-icon{background:rgba(255,255,255,0.1)}
.entry-card.gestao .entry-arrow{color:rgba(255,255,255,0.35)}

.entry-icon{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.entry-texts{text-align:left;flex:1}
.entry-title{font-size:14px;font-weight:700;margin-bottom:2px;letter-spacing:.01em}
.entry-sub{font-size:12px}
.entry-arrow{font-size:16px;flex-shrink:0}

/* RODAPÉ */
.footer{margin-top:28px;font-size:10px;color:rgba(255,255,255,0.2);letter-spacing:.15em;text-transform:uppercase}
</style>
</head>
<body>
<div class="container">
  <div class="logo-wrap">
    <div class="logo-ring">
      <img src="logo.png" alt="V Carlos Saúde">
    </div>
  </div>

  <div class="brand-name">V Carlos Saúde</div>
  <div class="brand-sub">Sistema de Gestão de Leads</div>

  <div class="divider"><div class="divider-diamond"></div></div>

  <div class="cards">
    <a class="entry-card vendedor" href="vendedor.html">
      <div class="entry-icon">👤</div>
      <div class="entry-texts">
        <div class="entry-title">Área do Vendedor</div>
        <div class="entry-sub">Registrar e acompanhar atendimentos</div>
      </div>
      <span class="entry-arrow">→</span>
    </a>
    <a class="entry-card gestao" href="gestao.html">
      <div class="entry-icon">📊</div>
      <div class="entry-texts">
        <div class="entry-title">Gestão de Tráfego</div>
        <div class="entry-sub">Dashboard e relatórios da equipe</div>
      </div>
      <span class="entry-arrow">→</span>
    </a>
  </div>

  <div class="footer">© 2025 V Carlos Saúde</div>
</div>
</body>
</html>
