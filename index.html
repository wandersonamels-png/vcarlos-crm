<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V Carlos Saúde — CRM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Georgia,sans-serif}
:root{--green:#1E4D3B;--green-light:#2A6B52;--green-pale:#E8F2EE;--gold:#C9A84C;--text:#1a1a1a;--muted:#6b7280;--border:#e5e7eb;--bg:#F7F9F8}
body{background:var(--bg);min-height:100vh;display:flex;flex-direction:column}

/* HERO */
.hero{background:var(--green);min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Ccircle cx='30' cy='30' r='20'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");pointer-events:none}
.hero-inner{text-align:center;padding:2rem;z-index:1;position:relative}
.logo-wrap{margin-bottom:2rem}
.logo-wrap img{width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,0.2);box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.hero h1{font-size:28px;font-weight:300;color:#fff;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.hero p{font-size:14px;color:rgba(255,255,255,0.6);letter-spacing:.05em;margin-bottom:3rem}
.divider{width:40px;height:1px;background:var(--gold);margin:0 auto 2.5rem}

.cards{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px;margin:0 auto}
.entry-card{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:18px 20px;cursor:pointer;display:flex;align-items:center;gap:16px;transition:all .2s;text-decoration:none}
.entry-card:hover{background:rgba(255,255,255,0.13);border-color:rgba(255,255,255,0.25);transform:translateY(-1px)}
.entry-icon{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.entry-title{font-size:15px;font-weight:600;color:#fff;margin-bottom:2px}
.entry-sub{font-size:12px;color:rgba(255,255,255,0.5)}
.entry-arrow{margin-left:auto;color:rgba(255,255,255,0.4);font-size:18px}

.footer-brand{position:absolute;bottom:20px;font-size:11px;color:rgba(255,255,255,0.3);letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
<div class="hero">
  <div class="hero-inner">
    <div class="logo-wrap">
      <img src="logo.png" alt="V Carlos Saúde">
    </div>
    <h1>V Carlos Saúde</h1>
    <p>Sistema de Gestão de Leads</p>
    <div class="divider"></div>
    <div class="cards">
      <a class="entry-card" href="vendedor.html">
        <div class="entry-icon">👤</div>
        <div>
          <div class="entry-title">Área do Vendedor</div>
          <div class="entry-sub">Registrar e acompanhar atendimentos</div>
        </div>
        <span class="entry-arrow">→</span>
      </a>
      <a class="entry-card" href="gestao.html">
        <div class="entry-icon">📊</div>
        <div>
          <div class="entry-title">Gestão de Tráfego</div>
          <div class="entry-sub">Dashboard e relatórios da equipe</div>
        </div>
        <span class="entry-arrow">→</span>
      </a>
    </div>
  </div>
  <span class="footer-brand">© 2025 V Carlos Saúde</span>
</div>
</body>
</html>
